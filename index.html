<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wicked Deal — Crew Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="src/style.css?v=21" />
</head>
<body>

<header class="site">
  <div class="header-inner">
    <div class="logos">
      <img src="assets/logos.png" alt="UFA Fiction · GoEast · DNA Production" />
    </div>
    <div class="title-row">
      <div>
        <p class="project-tag">Production Crew</p>
        <h1>Wicked Deal</h1>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="printBtn" title="Print or save as PDF">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
          <span>Print / PDF</span>
        </button>
      </div>
    </div>
  </div>
</header>

<main>
  <section class="poi-section" id="section-office">
    <div class="poi-section-head">
      <span class="cat-icon office" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="7" width="20" height="14" rx="2"></rect>
          <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"></path>
          <path d="M2 13h20"></path>
        </svg>
      </span>
      <h2>Production Office</h2>
      <span class="poi-count" id="count-office">1</span>
    </div>
    <div class="poi-grid" id="grid-office"></div>
  </section>

  <section class="poi-section" id="section-hotel">
    <div class="poi-section-head">
      <span class="cat-icon hotel" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 18V8a2 2 0 0 1 2-2h6v6"></path>
          <path d="M21 18v-4a2 2 0 0 0-2-2H11"></path>
          <path d="M3 14h18"></path>
          <path d="M3 18h18"></path>
          <circle cx="7.5" cy="10.5" r="1.5"></circle>
        </svg>
      </span>
      <h2>Accommodation</h2>
      <span class="poi-count" id="count-hotel">3</span>
    </div>
    <div class="poi-grid" id="grid-hotel"></div>
  </section>

  <section class="poi-section" id="section-location">
    <div class="poi-section-head">
      <span class="cat-icon location" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1-.3 2.1.3 2.4 1.3z"/>
          <path d="M6.2 5.7 5 11"/><path d="M10.7 4.4l1.2 5.3"/><path d="M15.2 3.1l1.2 5.3"/>
          <path d="M2 11h20v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z"/>
        </svg>
      </span>
      <h2>Filming Locations</h2>
      <span class="poi-count" id="count-location">12</span>
    </div>
    <div class="poi-grid" id="grid-location"></div>
  </section>

  <section class="map-shell">
    <div class="map-toolbar">
      <span class="label">Filter</span>
      <button class="filter-btn active" data-filter="all">All POIs</button>
      <button class="filter-btn" data-filter="office">
        <span class="swatch" style="background: var(--office);"></span>Production Office
      </button>
      <button class="filter-btn" data-filter="hotel">
        <span class="swatch" style="background: var(--hotel);"></span>Accommodation
      </button>
      <button class="filter-btn" data-filter="location">
        <span class="swatch" style="background: var(--location);"></span>Filming Locations
      </button>
      <button class="reset-view" id="resetView">Reset Map to overview</button>
      <button class="filter-btn top-btn" id="topBtn" title="Scroll to top">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
        Top of Page
      </button>
    </div>
    <div id="map"></div>
  </section>
</main>

<footer>
  © Wicked Deal · Production crew map · Map data © OpenStreetMap contributors · Travel times approximate (Bratislava daytime)
</footer>

<!-- SVG sprite -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ic-briefcase" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="7" width="20" height="14" rx="2"></rect>
        <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"></path>
        <path d="M2 13h20"></path>
      </g>
    </symbol>
    <symbol id="ic-bed" viewBox="0 0 24 24">
      <g fill="currentColor">
        <rect x="2" y="7" width="2.2" height="11" rx="0.4"></rect>
        <circle cx="7.2" cy="10" r="2.1"></circle>
        <path d="M4.2 13.6 H20 a1.4 1.4 0 0 1 1.4 1.4 v0.6 H4.2 z"></path>
        <rect x="2" y="15.6" width="20" height="2.4" rx="0.4"></rect>
      </g>
    </symbol>
    <symbol id="ic-car" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 17h14"></path>
        <path d="M5 13l1.5-4.5A2 2 0 0 1 8.4 7h7.2a2 2 0 0 1 1.9 1.5L19 13"></path>
        <rect x="3" y="13" width="18" height="5" rx="1"></rect>
        <circle cx="7.5" cy="17.5" r="1"></circle>
        <circle cx="16.5" cy="17.5" r="1"></circle>
      </g>
    </symbol>
    <symbol id="ic-tram" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="4" width="14" height="14" rx="2"></rect>
        <path d="M5 11h14"></path>
        <path d="M9 4V2h6v2"></path>
        <path d="M7 21l2-3"></path>
        <path d="M17 21l-2-3"></path>
        <circle cx="9" cy="15" r="0.6"></circle>
        <circle cx="15" cy="15" r="0.6"></circle>
      </g>
    </symbol>
    <symbol id="ic-clapper" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1-.3 2.1.3 2.4 1.3z"/>
        <path d="M6.2 5.7 5 11"/><path d="M10.7 4.4l1.2 5.3"/><path d="M15.2 3.1l1.2 5.3"/>
        <path d="M2 11h20v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z"/>
      </g>
    </symbol>
    <symbol id="ic-route" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="6" cy="19" r="2"></circle>
        <circle cx="18" cy="5" r="2"></circle>
        <path d="M8 19h7a4 4 0 0 0 0-8H9a4 4 0 0 1 0-8h7"></path>
      </g>
    </symbol>
  </defs>
</svg>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="src/data.js?v=21"></script>
<script src="src/map.js?v=21"></script>
<script src="src/app.js?v=21"></script>
</body>
</html>
